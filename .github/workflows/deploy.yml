# My2KBuilder — production deploy pipeline (R11; R10.5 APPROVED_FOR_PRODUCTION_RELEASE)
# push to main → install (locked) → typecheck → lint → next build → opennext build
#   → wrangler deploy --env production → post-deploy smoke on same commit
# Secrets (GitHub Actions Secrets, values never committed/printed):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my2kbuilder-production-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Build (Next.js; CANONICAL_HOST via committed .env.production)
        run: npm run build

      - name: Build (OpenNext Cloudflare)
        run: npm run opennext:build

      - name: Deploy to Cloudflare Workers (env=production)
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke (same commit)
        run: bash scripts/production-smoke-ci.sh
