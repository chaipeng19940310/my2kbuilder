<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="My2KBuilder artwork">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB03A" stop-opacity="0.26"/>
      <stop offset="0.48" stop-color="#070D1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D0F7" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="18" fill="#0E1628" stroke="#1E293B"/>
  <rect width="96" height="96" rx="18" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="80" height="80" rx="14" fill="none" stroke="#FFB03A" stroke-opacity="0.16"/>
  <g fill="none" stroke="#D4E4FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M18 72h42" opacity="0.45"/>
    <!-- jumpshot figure: upright, full extension release -->
    <circle cx="42" cy="18" r="6"/>
    <path d="M42 24v20"/>
    <path d="M42 28l10-10 3-8"/>
    <path d="M42 28l-8-8-2-8"/>
    <path d="M42 44l-8 14-3 14"/>
    <path d="M42 44l9 13 4 15"/>
    <!-- ball at release -->
    <circle cx="57" cy="8" r="4.5" stroke="#FFB03A"/>
    <!-- shot arc to rim -->
    <path d="M61 6c10 2 16 8 18 16" stroke="#A3E635" stroke-dasharray="3 4" opacity="0.9"/>
    <!-- rim + net hint -->
    <path d="M72 24h14" stroke="#FFB03A"/>
    <path d="M74 24l2 8M82 24l-2 8" opacity="0.7"/>
  </g>
  <text x="48" y="86" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" letter-spacing="1.2" fill="#94A3B8">SHOOTING GUARD</text>
</svg>
